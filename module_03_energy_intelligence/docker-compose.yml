version: '3.8'

services:
  energy-intelligence:
    build: .
    ports:
      - "8003:8003"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://frost:frost_polar_2026@postgres-timescale:5432/frost_energy
      - REDIS_URL=redis://redis-energy:6379/0
      - STATION_ID=FROST-STATION-ALPHA
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres-timescale:
        condition: service_healthy
      redis-energy:
        condition: service_healthy
    restart: unless-stopped

  postgres-timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_USER=frost
      - POSTGRES_PASSWORD=frost_polar_2026
      - POSTGRES_DB=frost_energy
    ports:
      - "5434:5432"
    volumes:
      - timescale_energy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frost -d frost_energy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-energy:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_energy_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescale_energy_data:
  redis_energy_data:
