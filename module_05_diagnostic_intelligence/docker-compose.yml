version: '3.8'

services:
  diagnostic-intelligence:
    build: .
    ports:
      - "8005:8005"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://frost:frost_polar_2026@postgres-diag:5432/frost_diagnostic
      - REDIS_URL=redis://redis-diag:6379/0
      - STATION_ID=FROST-STATION-ALPHA
      - LOG_LEVEL=DEBUG
      - MOCK_MODE=true
    depends_on:
      postgres-diag:
        condition: service_healthy
      redis-diag:
        condition: service_healthy
    restart: unless-stopped

  postgres-diag:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_USER=frost
      - POSTGRES_PASSWORD=frost_polar_2026
      - POSTGRES_DB=frost_diagnostic
    ports:
      - "5435:5432"
    volumes:
      - timescale_diag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frost -d frost_diagnostic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-diag:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - redis_diag_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescale_diag_data:
  redis_diag_data:
