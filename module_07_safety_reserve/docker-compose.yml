version: '3.8'

services:
  module_07_safety_reserve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frost_module_07_safety_reserve
    ports:
      - "8007:8007"
    environment:
      - STATION_ID=POLAR-STATION-ALPHA
      - PORT=8007
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./module_07.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: frost_redis_m07
    ports:
      - "6379:6379"
