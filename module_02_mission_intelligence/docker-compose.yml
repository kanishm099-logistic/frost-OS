version: '3.8'

services:
  mission-intelligence:
    build: .
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://frost:frost_polar_2026@postgres:5432/frost_missions
      - REDIS_URL=redis://redis:6379/0
      - STATION_ID=FROST-STATION-ALPHA
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=frost
      - POSTGRES_PASSWORD=frost_polar_2026
      - POSTGRES_DB=frost_missions
    ports:
      - "5433:5432"
    volumes:
      - postgres_mission_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frost -d frost_missions"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_mission_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_mission_data:
  redis_mission_data:
